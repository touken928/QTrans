name: Unit tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: macos-14
    timeout-minutes: 180
    env:
      CMAKE_PRESET: arm64-osx-release
      BUILD_DIR: ${{ github.workspace }}/build/arm64-osx-release
      VCPKG_ROOT: /Users/runner/vcpkg
      VCPKG_TARGET_TRIPLET: arm64-osx-release
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      VCPKG_INSTALL_ROOT: ${{ github.workspace }}/build/arm64-osx-release/vcpkg_installed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ninja pkg-config autoconf autoconf-archive automake libtool

      - name: Cache vcpkg downloads
        id: cache-vcpkg-downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/downloads
          key: vcpkg-downloads-macos-arm64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'overlay/llama-cpp/portfile.cmake', 'overlay/llama-cpp/vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-macos-arm64-

      - name: Cache vcpkg binary artifacts
        id: cache-vcpkg-blobs
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-blobs-macos-arm64-release-only-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'overlay/llama-cpp/portfile.cmake', 'overlay/llama-cpp/vcpkg.json') }}
          restore-keys: |
            vcpkg-blobs-macos-arm64-release-only-

      - name: Cache vcpkg_installed
        id: cache-vcpkg-installed
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_INSTALL_ROOT }}
          key: vcpkg-installed-macos-arm64-release-only-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'overlay/llama-cpp/portfile.cmake', 'overlay/llama-cpp/vcpkg.json') }}

      - name: Setup vcpkg
        shell: bash
        run: |
          mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"

          BASELINE="$(grep -o '"baseline": "[^"]*"' vcpkg-configuration.json | head -1 | cut -d'"' -f4)"
          if [ ! -d "${VCPKG_ROOT}/.git" ]; then
            downloads_backup=""
            if [ -d "${VCPKG_ROOT}/downloads" ]; then
              downloads_backup="$(mktemp -d)"
              mv "${VCPKG_ROOT}/downloads" "${downloads_backup}/downloads"
            fi
            rm -rf "${VCPKG_ROOT}"
            git clone https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
            if [ -n "${downloads_backup}" ] && [ -d "${downloads_backup}/downloads" ]; then
              rm -rf "${VCPKG_ROOT}/downloads"
              mv "${downloads_backup}/downloads" "${VCPKG_ROOT}/downloads"
              rmdir "${downloads_backup}" 2>/dev/null || true
            fi
          fi

          git -C "${VCPKG_ROOT}" fetch --depth 1 origin "${BASELINE}"
          git -C "${VCPKG_ROOT}" checkout "${BASELINE}"
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh"

      - name: Install vcpkg dependencies (Release)
        shell: bash
        run: |
          "${VCPKG_ROOT}/vcpkg" install \
            --triplet "${VCPKG_TARGET_TRIPLET}" \
            --host-triplet "${VCPKG_TARGET_TRIPLET}" \
            --x-manifest-root="${GITHUB_WORKSPACE}" \
            --x-install-root="${VCPKG_INSTALL_ROOT}" \
            --clean-after-build

      - name: Configure with tests
        shell: bash
        run: cmake --preset "${CMAKE_PRESET}" -DQTRANS_BUILD_TESTS=ON

      - name: Build tests
        shell: bash
        run: cmake --build --preset "${CMAKE_PRESET}" --parallel "$(sysctl -n hw.ncpu)"

      - name: Run unit tests
        shell: bash
        run: ctest --test-dir "${BUILD_DIR}" --output-on-failure
