name: Release Windows

on:
  workflow_call:

jobs:
  build-mingw-x64:
    name: MinGW x64
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CMAKE_PRESET: x64-mingw-static-release
      VCPKG_HOST_TRIPLET: x64-mingw-static-release
      DIST_SUFFIX: windows-x64
      VCPKG_ROOT: C:\vcpkg
      VCPKG_TARGET_TRIPLET: x64-mingw-static-release
      VCPKG_INSTALL_ROOT: ${{ github.workspace }}/build/x64-mingw-static-release/vcpkg_installed
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\\.vcpkg-cache,readwrite
      BUILD_DIR: ${{ github.workspace }}/build/x64-mingw-static-release
      LLVM_MINGW: C:\llvm-mingw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        shell: pwsh
        run: |
          $bin = "C:\ninja"
          if (-not (Test-Path "$bin\ninja.exe")) {
            Write-Host "Downloading Ninja..."
            $url = "https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip"
            $archive = Join-Path $env:TEMP "ninja.zip"
            Invoke-WebRequest -Uri $url -OutFile $archive
            Expand-Archive -Path $archive -DestinationPath $bin
          } else {
            Write-Host "Ninja already cached"
          }
          echo $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup llvm-mingw
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:LLVM_MINGW\bin\clang.exe")) {
            Write-Host "Downloading llvm-mingw..."
            $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20250114/llvm-mingw-20250114-ucrt-x86_64.zip"
            $archive = Join-Path $env:TEMP "llvm-mingw.zip"
            Invoke-WebRequest -Uri $url -OutFile $archive
            Expand-Archive -Path $archive -DestinationPath $env:TEMP
            $extracted = Get-ChildItem "$env:TEMP\llvm-mingw-*" -Directory | Select-Object -First 1
            Move-Item $extracted.FullName $env:LLVM_MINGW
          } else {
            Write-Host "llvm-mingw already cached"
          }
          echo "$env:LLVM_MINGW\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Ninja
        uses: actions/cache@v4
        with:
          path: C:\ninja
          key: ninja-win-1.12.1

      - name: Cache llvm-mingw
        uses: actions/cache@v4
        with:
          path: ${{ env.LLVM_MINGW }}
          key: llvm-mingw-20250114-ucrt-x86_64

      - name: Cache vcpkg binary artifacts
        id: cache-vcpkg-blobs
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-blobs-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'overlay/llama-cpp/portfile.cmake', 'overlay/llama-cpp/vcpkg.json') }}
          restore-keys: |
            vcpkg-blobs-windows-x64-

      - name: Cache vcpkg_installed
        id: cache-vcpkg-installed
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_INSTALL_ROOT }}
          key: vcpkg-installed-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'overlay/llama-cpp/portfile.cmake', 'overlay/llama-cpp/vcpkg.json') }}
          restore-keys: |
            vcpkg-installed-windows-x64-

      - name: Cache build objects
        id: cache-build
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}/core
            ${{ env.BUILD_DIR }}/apps
            ${{ env.BUILD_DIR }}/build.ninja
            ${{ env.BUILD_DIR }}/.ninja_log
            ${{ env.BUILD_DIR }}/.ninja_deps
          key: build-objects-windows-x64-${{ hashFiles('apps/desktop/src/**/*.cpp', 'apps/desktop/src/**/*.h', 'apps/desktop/src/**/*.mm', 'core/src/**/*.cpp', 'core/include/**/*.h', 'core/tests/**/*.cpp') }}
          restore-keys: |
            build-objects-windows-x64-

      - name: Setup vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

          $config = Get-Content vcpkg-configuration.json | ConvertFrom-Json
          $baseline = $config.'default-registry'.baseline
          if (-not (Test-Path "$env:VCPKG_ROOT\.git")) {
            Remove-Item $env:VCPKG_ROOT -Recurse -Force -ErrorAction SilentlyContinue
            git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          }

          git -C $env:VCPKG_ROOT fetch --depth 1 origin $baseline
          git -C $env:VCPKG_ROOT checkout $baseline
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

          Write-Host "binary artifacts cache hit: ${{ steps.cache-vcpkg-blobs.outputs.cache-hit }}"
          Write-Host "vcpkg_installed cache hit: ${{ steps.cache-vcpkg-installed.outputs.cache-hit }}"
          Write-Host "build objects cache hit: ${{ steps.cache-build.outputs.cache-hit }}"

          if (Test-Path $env:VCPKG_INSTALL_ROOT) {
            Get-ChildItem $env:VCPKG_INSTALL_ROOT -Recurse -Directory -Filter 'qtbase*' |
              Select-Object -First 5 |
              ForEach-Object { $_.FullName }
          } else {
            Write-Host "vcpkg_installed missing - dependencies will compile from source"
          }

          $blobCount = (Get-ChildItem $env:VCPKG_DEFAULT_BINARY_CACHE -Recurse -File -ErrorAction SilentlyContinue | Measure-Object).Count
          Write-Host "binary cache files: $blobCount"

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --triplet "$env:VCPKG_TARGET_TRIPLET" `
            --host-triplet "$env:VCPKG_HOST_TRIPLET" `
            --x-manifest-root="$env:GITHUB_WORKSPACE" `
            --x-install-root="$env:VCPKG_INSTALL_ROOT" `
            --clean-after-build

      - name: Configure application
        shell: pwsh
        run: |
          $llvmMingw = $env:LLVM_MINGW -replace '\\', '/'
          cmake `
            "--preset=$env:CMAKE_PRESET" `
            "-DCMAKE_SYSTEM_NAME=Windows" `
            "-DCMAKE_C_COMPILER=$llvmMingw/bin/x86_64-w64-mingw32-gcc.exe" `
            "-DCMAKE_CXX_COMPILER=$llvmMingw/bin/x86_64-w64-mingw32-g++.exe" `
            "-DCMAKE_MAKE_PROGRAM=C:/ninja/ninja.exe" `
            "-DVCPKG_HOST_TRIPLET=$env:VCPKG_HOST_TRIPLET" `
            "-DVCPKG_INSTALLED_DIR=$env:VCPKG_INSTALL_ROOT" `
            "-DVCPKG_APPLOCAL_DEPS=OFF"

      - name: Build application
        shell: pwsh
        run: cmake --build --preset $env:CMAKE_PRESET --parallel $env:NUMBER_OF_PROCESSORS

      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $binary = "build/$env:CMAKE_PRESET/apps/desktop/QTrans.exe"
          $objdump = "$env:LLVM_MINGW/bin/llvm-objdump.exe"
          $stage = "dist/QTrans-$version-$env:DIST_SUFFIX"
          $zip = "$stage.zip"

          & $objdump -p $binary | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Invalid PE binary"
          }

          $imports = & $objdump -p $binary |
            Select-String -SimpleMatch "DLL Name:" |
            ForEach-Object { ($_ -split "DLL Name:\s+", 2)[1].Trim() }

          Write-Host "Imported DLLs:"
          $imports | ForEach-Object { Write-Host "  $_" }

          $forbiddenPatterns = @(
            'libgcc', 'libstdc\+\+', 'libwinpthread',
            'ggml', 'qt6', 'vcpkg'
          )
          foreach ($dll in $imports) {
            $lower = $dll.ToLowerInvariant()
            foreach ($pattern in $forbiddenPatterns) {
              if ($lower -match $pattern) {
                Write-Error "Unexpected third-party DLL dependency in static Windows build: $dll"
              }
            }
          }

          $libomp = "$env:LLVM_MINGW/bin/libomp.dll"
          if (-not (Test-Path $libomp)) {
            Write-Error "libomp.dll not found in llvm-mingw: $libomp"
          }

          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $binary "$stage/QTrans.exe"
          Copy-Item $libomp "$stage/libomp.dll"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }
          Compress-Archive -Path "$stage/*" -DestinationPath $zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qtrans-windows-x64
          path: dist/QTrans-*-windows-x64.zip
          if-no-files-found: error
