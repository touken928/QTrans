name: Build / macOS

on:
  workflow_call:
    inputs:
      package:
        description: Package and upload the release artifact
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      package:
        description: Verify imports and upload the release package
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ inputs.package && 'macOS arm64 release' || 'Unit tests' }}
    runs-on: macos-14
    timeout-minutes: 180
    env:
      CMAKE_PRESET: arm64-osx-release
      BUILD_DIR: ${{ github.workspace }}/build/arm64-osx-release
      DIST_SUFFIX: macos-arm64
      CONAN_PROFILE: conan/profiles/macos-arm64
      CONAN_OUTPUT_FOLDER: ${{ github.workspace }}/build/arm64-osx-release/conan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore release binary
        if: ${{ inputs.package }}
        id: restore-release-binary
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_DIR }}/src/desktop/QTrans
          key: release-binary-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CMAKE_PRESET }}-${{ github.sha }}

      - name: Install build tools
        if: ${{ !inputs.package || steps.restore-release-binary.outputs.cache-hit != 'true' }}
        run: brew install ninja pkg-config autoconf autoconf-archive automake libtool

      - name: Install Conan dependencies
        if: ${{ !inputs.package || steps.restore-release-binary.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/setup-conan
        with:
          profile: ${{ env.CONAN_PROFILE }}
          output-folder: ${{ env.CONAN_OUTPUT_FOLDER }}

      - name: Configure tests
        if: ${{ !inputs.package }}
        working-directory: app
        run: cmake --preset "${CMAKE_PRESET}" -DQTRANS_BUILD_TESTS=ON

      - name: Configure release
        if: ${{ inputs.package && steps.restore-release-binary.outputs.cache-hit != 'true' }}
        working-directory: app
        run: cmake --preset "${CMAKE_PRESET}" -DQTRANS_BUILD_TESTS=OFF

      - name: Build
        if: ${{ !inputs.package || steps.restore-release-binary.outputs.cache-hit != 'true' }}
        working-directory: app
        run: cmake --build --preset "${CMAKE_PRESET}" --parallel "$(sysctl -n hw.ncpu)"

      - name: Save release binary
        if: ${{ inputs.package && steps.restore-release-binary.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_DIR }}/src/desktop/QTrans
          key: release-binary-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CMAKE_PRESET }}-${{ github.sha }}

      - name: Run tests
        if: ${{ !inputs.package }}
        run: ctest --test-dir "${BUILD_DIR}" --output-on-failure

      - name: Verify imports and package
        if: ${{ inputs.package }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          binary="${BUILD_DIR}/src/desktop/QTrans"
          output="dist/QTrans-${version}-${DIST_SUFFIX}"

          mkdir -p dist
          cp "${binary}" "${output}"
          chmod +x "${output}"

          if otool -L "${output}" | grep -E '@rpath|/.conan2/'; then
            echo "Unexpected dynamic third-party libraries in static macOS build"
            otool -L "${output}"
            exit 1
          fi

      - name: Upload release artifact
        if: ${{ inputs.package }}
        uses: actions/upload-artifact@v4
        with:
          name: qtrans-macos-arm64
          path: dist/QTrans-*-macos-arm64
          if-no-files-found: error
