name: Install Conan dependencies
description: Restore the Conan cache and install the locked dependency graph.

inputs:
  profile:
    description: Repository host profile
    required: true
  lockfile:
    description: Platform lockfile
    required: true
  output-folder:
    description: Folder for Conan CMake generators
    required: true

runs:
  using: composite
  steps:
    - name: Install Conan
      shell: bash
      run: pipx install conan==2.28.1

    - name: Restore Conan cache
      id: restore-conan-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.conan2
        key: conan-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(inputs.profile, inputs.lockfile) }}
        restore-keys: |
          conan-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Detect build profile
      shell: bash
      run: conan profile detect --force

    - name: Install dependencies
      shell: bash
      env:
        CONAN_WORKSPACE_ENABLE: will_break_next
      run: >-
        conan install app
        --profile:host "${{ inputs.profile }}"
        --profile:build default
        --lockfile "${{ inputs.lockfile }}"
        -c:b tools.cmake.cmaketoolchain:generator=Ninja
        --settings:build compiler.cppstd=17
        --output-folder "${{ inputs.output-folder }}"
        --build missing

    - name: Save Conan cache
      if: ${{ success() && steps.restore-conan-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ~/.conan2
        key: conan-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(inputs.profile, inputs.lockfile) }}
